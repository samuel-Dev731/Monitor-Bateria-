name: Build Android APK
on:
  push:
    branches: [ "main", "feature/floating-performance-monitor", "feature/1.2.5-native-dotnet-monitor" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.0"
      - name: Build debug APK with native libraries
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: Monitor-Bateria-Pro-1.2.5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
